# 운영 서버(steeljoon.store) 전용 HTTPS 설정.
# 로컬에는 인증서 파일이 없어 이 파일을 로드하면 nginx가 죽는다.
# 그래서 이 파일은 기본적으로 로드되지 않고, 운영 서버의 docker-compose.override.yml에서만
# 아래처럼 마운트해서 사용한다.
#
#   services:
#     nginx:
#       volumes:
#         - ./docker/nginx/ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
#
# 프로젝트마다 서브도메인을 하나씩 쓰는 구조다. 새 토이 프로젝트가 생기면 이 파일에
# 서버 블록을 하나 더 추가하고, 인증서도 certbot --expand로 그 서브도메인을 추가해야 한다.

# steeljoon.store / www.steeljoon.store (루트): 실제 서비스로 보내지 않고,
# 어떤 서브도메인들이 있는지 안내만 한다.
server {
    listen 443 ssl;
    server_name steeljoon.store www.steeljoon.store;

    ssl_certificate /etc/letsencrypt/live/steeljoon.store-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/steeljoon.store-0001/privkey.pem;

    default_type application/json;
    location / {
        return 200 '{"status":"ok","message":"steeljoon.store - 프로젝트 목록: map.steeljoon.store"}';
    }
}

# map.steeljoon.store: 이 저장소의 Laravel 앱. 서브도메인이라 이 앱은 자기가
# 그냥 도메인 루트("/")에서 돌고 있다고 알면 되고, base path를 속이는 트릭이 필요 없다.
server {
    listen 443 ssl;
    server_name map.steeljoon.store;
    root /var/www/html/public;
    index index.php index.html;

    ssl_certificate /etc/letsencrypt/live/steeljoon.store-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/steeljoon.store-0001/privkey.pem;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 32m;
}
