# 운영 서버(steeljoon.store) 전용 HTTPS 설정.
# 로컬에는 인증서 파일이 없어 이 파일을 로드하면 nginx가 죽는다.
# 그래서 이 파일은 기본적으로 로드되지 않고, 운영 서버의 docker-compose.override.yml에서만
# 아래처럼 마운트해서 사용한다.
#
#   services:
#     nginx:
#       volumes:
#         - ./docker/nginx/ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
#

# 메인 서비스 (Laravel)
server {
    listen 443 ssl;
    server_name steeljoon.store www.steeljoon.store;
    root /var/www/html/public;
    index index.php index.html;

    ssl_certificate /etc/letsencrypt/live/steeljoon.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/steeljoon.store/privkey.pem;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 32m;
}

# API 서버용 자리 (api.steeljoon.store)
# 지금은 뒤에 실제 서비스(주문/재고 서버)가 없어 안내 문구만 응답한다.
# 나중에 Laravel/Python 서비스를 붙일 때 이 블록 안에 location /order/, location /stock/ 등을 추가한다.
server {
    listen 443 ssl;
    server_name api.steeljoon.store;

    ssl_certificate /etc/letsencrypt/live/steeljoon.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/steeljoon.store/privkey.pem;

    default_type application/json;
    location / {
        return 200 '{"status":"ok","message":"api.steeljoon.store - 아직 연결된 서비스가 없습니다."}';
    }
}
