# 로컬 개발용 (laravel.test / localhost) - HTTP 그대로 서빙
server {
    listen 80;
    server_name laravel.test www.laravel.test localhost;
    root /var/www/html/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 32m;
}

# 운영 도메인 HTTP: ACME 인증 경로만 처리하고 나머지는 HTTPS로 리다이렉트
server {
    listen 80;
    server_name steeljoon.store www.steeljoon.store api.steeljoon.store;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 운영 도메인 HTTPS
server {
    listen 443 ssl;
    server_name steeljoon.store www.steeljoon.store;
    root /var/www/html/public;
    index index.php index.html;

    ssl_certificate /etc/letsencrypt/live/steeljoon.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/steeljoon.store/privkey.pem;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 32m;
}
