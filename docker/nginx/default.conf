# 로컬 개발용 API 게이트웨이 (운영 api.steeljoon.store와 동일한 경로 구조)
server {
    listen 80;
    server_name api.steeljoon.test;
    root /var/www/html/public;
    index index.php index.html;

    # 슬래시 없이 /laravel 로만 접속해도 /laravel/ 로 보낸다
    location = /laravel {
        return 301 /laravel/;
    }

    # /laravel/xxx -> 정적 파일이면 그대로 서빙하고, 아니면 /laravel/index.php로 넘긴다.
    # (REQUEST_URI는 건드리지 않는다. 원본 그대로 "/laravel/xxx"를 유지해야
    #  아래 SCRIPT_NAME 트릭이 동작한다)
    location /laravel/ {
        rewrite ^/laravel(/.*)$ $1 break;
        try_files $uri /laravel/index.php?$query_string;
    }

    # /laravel/ 프론트 컨트롤러 전용.
    # 실제 파일은 document_root/index.php 이지만, SCRIPT_NAME만 /laravel/index.php로
    # 알려줘서 Laravel(Symfony)이 REQUEST_URI("/laravel/xxx")에서 "/laravel"을
    # 자기 base path로 인식하고 나머지("/xxx")를 라우팅 경로로 쓰게 만든다.
    location = /laravel/index.php {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /laravel/index.php;
        include fastcgi_params;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /python {
        return 301 /python/;
    }

    # 로컬에 Python 컨테이너가 아직 없어 자리만 잡아둔다.
    # 나중에 Python 컨테이너를 추가하면 proxy_pass http://python_app:포트/; 로 교체한다.
    location /python/ {
        default_type application/json;
        return 200 '{"status":"ok","message":"python 서비스가 아직 로컬에 없습니다."}';
    }

    # 운영(ssl.conf)과 동일하게, 도메인만 입력했을 때는 라라벨을 바로 보여주지 않고
    # 사용 가능한 경로를 안내한다. (실제 서비스는 /laravel/, /python/ 로만 접근)
    default_type application/json;
    location / {
        return 200 '{"status":"ok","message":"api.steeljoon.test - 사용 가능한 경로: /laravel/, /python/"}';
    }

    client_max_body_size 32m;
}

# 운영 도메인 HTTP: ACME 인증 경로만 처리하고 나머지는 HTTPS로 리다이렉트
server {
    listen 80;
    server_name steeljoon.store www.steeljoon.store api.steeljoon.store;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
