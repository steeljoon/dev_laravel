# 로컬 개발용 API 게이트웨이 (운영 api.steeljoon.store와 동일한 경로 구조)
server {
    listen 80;
    server_name api.steeljoon.test;
    root /var/www/html/public;
    index index.php index.html;

    # 슬래시 없이 /laravel 로만 접속해도 /laravel/ 로 보낸다
    location = /laravel {
        return 301 /laravel/;
    }

    # /laravel/xxx -> Laravel 앱에는 /xxx 로 전달 (앱 쪽 라우트는 그대로 둔다)
    location /laravel/ {
        rewrite ^/laravel/?(.*)$ /$1 break;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # /laravel/ 접두사를 뗀 뒤의 실제 경로를 Laravel(PHP)에도 그대로 알려준다.
        # (없으면 PHP는 원래 요청 경로인 /laravel/... 을 그대로 받아서 라우팅이 어긋난다)
        fastcgi_param REQUEST_URI $uri$is_args$args;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /python {
        return 301 /python/;
    }

    # 로컬에 Python 컨테이너가 아직 없어 자리만 잡아둔다.
    # 나중에 Python 컨테이너를 추가하면 proxy_pass http://python_app:포트/; 로 교체한다.
    location /python/ {
        default_type application/json;
        return 200 '{"status":"ok","message":"python 서비스가 아직 로컬에 없습니다."}';
    }

    client_max_body_size 32m;
}

# 운영 도메인 HTTP: ACME 인증 경로만 처리하고 나머지는 HTTPS로 리다이렉트
server {
    listen 80;
    server_name steeljoon.store www.steeljoon.store api.steeljoon.store;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
