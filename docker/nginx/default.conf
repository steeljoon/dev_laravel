# 로컬 개발용. 프로젝트마다 서브도메인을 하나씩 쓰는 구조 (운영 ssl.conf와 동일한 방식).
# 새 토이 프로젝트가 생기면 이 파일에 서버 블록을 하나 더 추가한다.

# steeljoon.test (루트): 실제 서비스로 보내지 않고, 어떤 서브도메인들이 있는지 안내만 한다.
server {
    listen 80;
    server_name steeljoon.test;
    default_type application/json;
    location / {
        return 200 '{"status":"ok","message":"steeljoon.test - 프로젝트 목록: map.steeljoon.test"}';
    }
}

# map.steeljoon.test: 이 저장소의 Laravel 앱. 서브도메인이라 이 앱은 자기가
# 그냥 도메인 루트("/")에서 돌고 있다고 알면 되고, base path를 속이는 트릭이 필요 없다.
server {
    listen 80;
    server_name map.steeljoon.test;
    root /var/www/html/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 32m;
}

# 운영 도메인 HTTP: ACME 인증 경로만 처리하고 나머지는 HTTPS로 리다이렉트.
# 새 서브도메인이 생기면 여기 server_name에도 추가해야 인증서 갱신/리다이렉트가 된다.
server {
    listen 80;
    server_name steeljoon.store www.steeljoon.store map.steeljoon.store;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
