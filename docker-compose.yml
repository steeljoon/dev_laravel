services:
  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - app
    networks:
      - app_net

  certbot:
    image: certbot/certbot
    container_name: laravel_certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  app:
    build:
      context: ./docker/php
    container_name: laravel_app
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net

  db:
    image: mariadb:10.11
    container_name: laravel_db
    restart: unless-stopped
    ports:
      # 127.0.0.1로만 묶어서, 이 컴퓨터(또는 운영 서버) 자기 자신만 접근 가능하게 한다.
      # 로컬: DBeaver 등에서 바로 localhost:3306으로 접속.
      # 운영: 인터넷에는 노출하지 않고, SSH 터널을 거쳐야만 접속 가능.
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net

volumes:
  db_data:
  certbot_etc:
  certbot_www:

networks:
  app_net:
    driver: bridge
