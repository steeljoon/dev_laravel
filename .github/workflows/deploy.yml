name: Deploy to Production

# main 브랜치에 push되면 운영 서버에 배포합니다.
# (회사에서 GitLab CI로 하던 것을 GitHub Actions로 옮긴 버전)
on:
  push:
    branches:
      - main
  workflow_dispatch: {}   # Actions 탭에서 수동 실행도 가능

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (워크플로 자체 확인용)
        uses: actions/checkout@v4

      # 운영 서버는 Docker Compose 기반(nginx + PHP-FPM + MariaDB)이므로,
      # 저장소를 pull 받은 뒤 이미지를 재빌드하고 컨테이너 안에서 artisan 명령을 실행합니다.
      # 서버에 이미 이 저장소가 git clone 되어 있고 .env가 구성되어 있다는 것이 전제입니다.
      - name: SSH로 접속해 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            docker compose up -d --build
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
