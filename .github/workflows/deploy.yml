name: Deploy to Production

# main 브랜치에 push되면 운영 서버에 배포합니다.
# (회사에서 GitLab CI로 하던 것을 GitHub Actions로 옮긴 버전)
on:
  push:
    branches:
      - main
  workflow_dispatch: {}   # Actions 탭에서 수동 실행도 가능

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (워크플로 자체 확인용)
        uses: actions/checkout@v4

      # 운영 서버는 Docker Compose 기반(nginx + PHP-FPM + MariaDB)이므로,
      # 저장소를 pull 받은 뒤 이미지를 재빌드하고 컨테이너 안에서 artisan 명령을 실행합니다.
      # 서버에 이미 이 저장소가 git clone 되어 있고 .env가 구성되어 있다는 것이 전제입니다.
      - name: SSH로 접속해 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            docker compose up -d --build
            # nginx 설정 파일(default.conf, ssl.conf)은 파일 단위로 bind mount 되어 있는데,
            # git pull이 파일을 그 자리에서 덮어쓰지 않고 새 파일로 교체(unlink+생성)하기 때문에
            # 기존 컨테이너의 마운트는 옛 파일(inode)을 계속 붙잡고 있게 된다.
            # "nginx -s reload"는 이 상태를 못 고치므로, nginx 컨테이너를 강제로 재생성해서
            # 마운트를 새로 맺어준다.
            docker compose up -d --force-recreate nginx
            # app(PHP-FPM) 컨테이너도 마찬가지 이유로 재생성이 필요하다.
            # git pull로 routes/web.php 같은 소스 파일이 바뀌어도, 이미 떠 있던 PHP-FPM
            # 워커 프로세스는 realpath_cache/OPcache 때문에 예전 상태(예: 오래된 라우트 캐시
            # 파일이 여전히 존재한다고 착각하는 것)를 계속 들고 있을 수 있다.
            # "php artisan route:clear/cache"만으로는 이미 떠 있는 워커까지는 못 고치므로,
            # 컨테이너 자체를 재생성해서 워커를 완전히 새로 띄운다.
            docker compose up -d --force-recreate app
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
